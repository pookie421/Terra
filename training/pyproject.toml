[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-shield"
version = "0.4.0"
description = "Research platform for multi-mechanism landslide scenario analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27,<1", "h3>=4.1,<5", "numpy>=1.23,<3", "Pillow>=9.5,<13",
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "joblib>=1.3,<2",
  "xgboost>=2.0,<4", "scikit-learn>=1.4,<2", "pyarrow>=14,<24",
]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]
